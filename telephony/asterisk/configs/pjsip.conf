[global]
type = global
user_agent = prema-ai-voice-agent

; ── Sample SIP trunk (replace with your provider's credentials) ────────────
; For legal outbound calls to Indian mobiles you need a DoT-licensed OSP or
; a provider that offers licensed termination. This template fits most.
[trunk-registration]
type = registration
outbound_auth = trunk-auth
server_uri = sip:sip.your-provider.in
client_uri = sip:USERNAME@sip.your-provider.in
retry_interval = 60

[trunk-auth]
type = auth
auth_type = userpass
username = USERNAME
password = PASSWORD

[trunk-aor]
type = AOR
contact = sip:sip.your-provider.in:5060

[trunk]
type = endpoint
context = from-trunk
disallow = all
allow = ulaw
allow = alaw
outbound_auth = trunk-auth
aors = trunk-aor
from_domain = sip.your-provider.in

[trunk-identify]
type = identify
endpoint = trunk
match = sip.your-provider.in
